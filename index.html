  <style>
    .font-editorial-serif {
      font-family: 'Google Sans Flex', 'Google Sans', sans-serif;
    }

    .font-google-sans {
      font-family: 'Google Sans', sans-serif;
    }

    :root {
      --bg-main: #121212;    
      --card-bg: #1c1c1c;    
      --text-main: #ff9aa2;  
      --sun-color: #1f1f1f;
    }

    body {
      transition: background-color 0.4s ease;
      background-color: var(--bg-main);
    }
    
    .letter-btn {
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease;
      will-change: transform;
      margin-right: -0.02em;
    }

    .letter-btn:hover {
      transform: translateY(-8px) scale(1.15) rotate(var(--hover-deg, 4deg));
      color: var(--bg-main) !important;
      background-color: var(--text-main);
      padding: 0 2px;
      border-radius: 2px;
    }

    .brand-letter, .nav-letter, .footer-letter, .home-btn-letter, .card-link-letter {
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .brand-letter:hover, .home-link:hover .home-btn-letter, .nav-link:hover .nav-letter, .footer-link:hover .footer-letter, .project-card:hover .card-link-letter {
      transform: translateY(-2px) scale(1.05) rotate(2deg);
      color: var(--bg-main) !important;
      background-color: var(--text-main);
      padding: 0 1px;
      border-radius: 2px;
    }

    .animated-box {
      transition: background-color 0.4s ease, color 0.4s ease, transform 0.3s ease-out;
    }

    .condensed-text {
      letter-spacing: -0.02em;
      transform: scaleX(0.95);
      transform-origin: center;
    }

    .radial-sun-graphic {
      width: clamp(525px, 82vw, 1125px);
      height: clamp(525px, 82vw, 1125px);
      fill: var(--sun-color);
      opacity: 0.85;
      animation: rotateSun 70s linear infinite;
      transition: fill 0.4s ease;
      will-change: transform;
    }

    @keyframes rotateSun {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Global fixed background elements */
    #globalBackdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    @keyframes steadyTwinkle {
      0%, 100% {
        opacity: var(--star-min-op, 0.75);
        transform: scale(0.95);
      }
      50% {
        opacity: var(--star-max-op, 1);
        transform: scale(1.12);
      }
    }

    @keyframes driftBlob {
      0% { 
        transform: translate(0px, 0px) scale(1) rotate(0deg); 
        border-radius: 35% 65% 60% 40% / 50% 45% 55% 50%;
      }
      33% {
        transform: translate(45px, -35px) scale(1.15) rotate(110deg);
        border-radius: 60% 40% 45% 55% / 45% 55% 50% 50%;
      }
      66% {
        transform: translate(-35px, 40px) scale(0.88) rotate(220deg);
        border-radius: 45% 55% 50% 50% / 55% 45% 60% 40%;
      }
      100% { 
        transform: translate(0px, 0px) scale(1) rotate(360deg); 
        border-radius: 35% 65% 60% 40% / 50% 45% 55% 50%;
      }
    }

    .sky-speck {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      opacity: var(--star-min-op, 0.8);
      animation: steadyTwinkle var(--star-dur, 12s) ease-in-out infinite;
      animation-delay: var(--star-delay, 0s);
    }

    /* Random, organic blob nebulas matching accent color */
    .organic-blob-nebula {
      position: absolute;
      pointer-events: none;
      filter: blur(140px);
      mix-blend-mode: screen;
      opacity: 0.13;
      transition: background 0.4s ease;
    }

    #nebula1 {
      width: 650px;
      height: 480px;
      animation: driftBlob 55s ease-in-out infinite;
    }
    #nebula2 {
      width: 720px;
      height: 520px;
      animation: driftBlob 68s ease-in-out infinite reverse;
      animation-delay: -20s;
    }
    #nebula3 {
      width: 550px;
      height: 400px;
      animation: driftBlob 62s ease-in-out infinite;
      animation-delay: -35s;
    }

    /* Sunburst animation container with sweet-spot pacing */
    #homeSunburstContainer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transform: scale(0.55) rotate(-20deg);
      transition: opacity 0.45s cubic-bezier(0.25, 1, 0.5, 1), transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #homeSunburstContainer.active {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .nav-link, .footer-link, .home-link {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      user-select: none;
    }

    /* Sweet-spot page transition wrapper: smooth, snappy, not sluggish */
    main {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
      pointer-events: none;
      will-change: transform, opacity;
      transition: transform 0.55s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.45s ease;
    }

    /* Custom scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: var(--text-main);
      border-radius: 4px;
    }
  </style>
</head>

<body class="relative h-screen w-screen overflow-hidden flex flex-col justify-between select-none text-white font-editorial-serif">

  <!-- TOP UTILITY BAR -->
  <header class="relative z-30 w-full grid grid-cols-3 items-center px-6 py-3 border-b-4 border-black shadow-[0_6px_0px_#000] bg-zinc-900/40 backdrop-blur-md">
    <div id="brandContainer" class="justify-self-start"></div>
    <nav class="flex items-center justify-center gap-8 justify-self-center">
      <button onclick="openPage('projects')" class="nav-link text-lg md:text-xl tracking-[-0.02em] lowercase font-editorial-serif" style="color: var(--text-main);" id="navProjects"></button>
      <button onclick="openPage('experience')" class="nav-link text-lg md:text-xl tracking-[-0.02em] lowercase font-editorial-serif" style="color: var(--text-main);" id="navExperience"></button>

  <!-- CONTENT CONTAINER -->
  <main id="mainContainer">

  </main>

  <!-- BOTTOM UTILITY BAR -->

    <div></div>
    <nav class="flex items-center justify-center gap-8 justify-self-center">
      <button onclick="openPage('academics')" class="footer-link text-lg md:text-xl tracking-[-0.02em] lowercase font-editorial-serif" style="color: var(--text-main);" id="footerAcademics"></button>
      <button onclick="openPage('who-i-am')" class="footer-link text-lg md:text-xl tracking-[-0.02em] lowercase font-editorial-serif" style="color: var(--text-main);" id="footerWhoIAM"></button>
    </nav>
    <div></div>

  <script>
    const creamyBrightPastels = [
      '#ff8fa3', '#ff9aa2', '#ff758f', '#ff85a1', '#ffa69e', '#ff9494', '#ff82a9', '#f78fb3', '#ff7eb3', '#ff9ebb',
      '#ffaa71', '#ffb085', '#ff9f68', '#ffb870', '#ffc078', '#ffa96b', '#ffbe76', '#f8a5c2', '#ffb380', '#ff9a76',
      '#ffd166', '#ffda79', '#ffe066', '#ffd460', '#ffcf56', '#f7d794', '#ffdf70', '#ffca64', '#ffd966', '#feca57',
      '#7bed9f', '#88e8a6', '#70e098', '#95f2b3', '#6ee7b7', '#7ce8b0', '#8ce99a', '#82e0aa', '#78e08f', '#80ed99',
      '#55efc4', '#63e6be', '#4ecdc4', '#64dfdf', '#72efdd', '#5ce1e6', '#67e8f9', '#56cfe1', '#68d8d6', '#70e4ef',
      '#74b9ff', '#70a1ff', '#82ccdd', '#778beb', '#7895ff', '#85a5ff', '#6c9eff', '#80b3ff', '#7aa2f7', '#89b4fa',
      '#a29bfe', '#b388ff', '#b983ff', '#c792ea', '#bb9af7', '#c490ff', '#b57edc', '#be95ff', '#a78bfa', '#c084fc',
      '#f368e0', '#ff77e9', '#f78fb3', '#e082ff', '#ea80fc', '#f285e8', '#eb8aff', '#f472b6', '#f087e8', '#e58cff'
    ];

    let currentAccentColor = creamyBrightPastels[Math.floor(Math.random() * creamyBrightPastels.length)];
    let currentPage = 'home';
    let isTransitioning = false;

    function randomizeNebulaPositions() {
      const n1 = document.getElementById('nebula1');
      const n2 = document.getElementById('nebula2');
      const n3 = document.getElementById('nebula3');

      if (n1) {
        n1.style.top = (Math.random() * 30 - 10) + '%';
        n1.style.left = (Math.random() * 30 - 15) + '%';
      }
      if (n2) {
        n2.style.bottom = (Math.random() * 30 - 10) + '%';
        n2.style.right = (Math.random() * 30 - 15) + '%';
      }
      if (n3) {
        n3.style.top = (Math.random() * 40 + 20) + '%';
        n3.style.right = (Math.random() * 40 + 10) + '%';
      }
    }

    function applyCurrentTheme() {
      document.documentElement.style.setProperty('--bg-main', '#121212');
      document.documentElement.style.setProperty('--card-bg', '#1c1c1c');
      document.documentElement.style.setProperty('--text-main', currentAccentColor);
      document.documentElement.style.setProperty('--sun-color', '#1f1f1f');

      const nebula1 = document.getElementById('nebula1');
      const nebula2 = document.getElementById('nebula2');
      const nebula3 = document.getElementById('nebula3');
      
      if (nebula1) nebula1.style.background = `radial-gradient(circle at 50% 50%, ${currentAccentColor} 0%, transparent 75%)`;
      if (nebula2) nebula2.style.background = `radial-gradient(circle at 45% 55%, ${currentAccentColor} 0%, transparent 75%)`;
      if (nebula3) nebula3.style.background = `radial-gradient(circle at 55% 45%, ${currentAccentColor} 0%, transparent 75%)`;
    }

    function generateNightSkySpecks() {
      const container = document.getElementById('starfieldContainer');
      if (!container) return;
      container.innerHTML = '';

      const totalSpecks = 150;
      for (let i = 0; i < totalSpecks; i++) {
        const speck = document.createElement('span');
        speck.className = 'sky-speck';

        const rand = Math.random();
        const size = rand > 0.88 ? 2.8 : rand > 0.45 ? 1.8 : 1.2;

        const left = (Math.random() * 100).toFixed(2) + '%';
        const top = (Math.random() * 100).toFixed(2) + '%';

        const colorRoll = Math.random();
        let starColor = '#f8fafc';
        let glow = 'none';

        if (colorRoll > 0.85) {
          starColor = '#fca5a5';
          glow = '0 0 5px #f87171';
        } else if (colorRoll > 0.70) {
          starColor = '#93c5fd';
          glow = '0 0 5px #60a5fa';
        } else if (colorRoll > 0.55) {
          starColor = '#fef08a';
          glow = '0 0 5px #fde047';
        } else if (colorRoll > 0.40) {
          starColor = currentAccentColor;
          glow = `0 0 6px ${currentAccentColor}`;
        }

        const minOp = (Math.random() * 0.25 + 0.65).toFixed(2);
        const maxOp = (Math.random() * 0.15 + 0.85).toFixed(2);
        const dur = (Math.random() * 9 + 9).toFixed(1) + 's';
        const delay = (-Math.random() * 15).toFixed(1) + 's';

        speck.style.width = `${size}px`;
        speck.style.height = `${size}px`;
        speck.style.left = left;
        speck.style.top = top;
        speck.style.backgroundColor = starColor;
        speck.style.boxShadow = size > 2 ? glow : 'none';
        speck.style.setProperty('--star-min-op', minOp);
        speck.style.setProperty('--star-max-op', maxOp);
        speck.style.setProperty('--star-dur', dur);
        speck.style.setProperty('--star-delay', delay);

        container.appendChild(speck);
      }
    }

    function buildInteractiveText(elementId, text, typeClass = 'letter-btn') {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';

      text.split('').forEach((char) => {
        const span = document.createElement('span');
        span.className = typeClass;
        span.style.color = 'var(--text-main)';
        
        if (typeClass === 'letter-btn') {
          const randomDeg = (Math.random() * 14 - 7).toFixed(1) + 'deg';
          span.style.setProperty('--hover-deg', randomDeg);
        }
        
        span.textContent = char;
        container.appendChild(span);
      });
    }

    function buildCustomText(elementId, text, className) {
      const container = document.getElementById(elementId);
      if (!container) return;
      container.innerHTML = '';

      text.split('').forEach((char) => {
        const span = document.createElement('span');
        if (char === ' ') {
          span.style.display = 'inline-block';
          span.style.width = '0.3em';
        } else {
          span.className = className;
          span.textContent = char;
        }
        container.appendChild(span);
      });
    }

    function renderHeaderBrand() {
      const brandContainer = document.getElementById('brandContainer');
      if (!brandContainer) return;
      brandContainer.innerHTML = '';

      if (currentPage !== 'home') {
        const button = document.createElement('button');
        button.onclick = () => openPage('home');
        button.className = 'home-link text-lg md:text-xl tracking-[-0.02em] lowercase font-google-sans flex items-center';
        button.style.color = 'var(--text-main)';
        button.id = 'homePageBtn';
        brandContainer.appendChild(button);
        buildCustomText('homePageBtn', 'home page', 'home-btn-letter');
      }
    }

    function renderMainContentHTML(page) {
      if (page === 'home') {
        return `
          <div class="relative pointer-events-auto flex flex-col items-center justify-center z-25">
            <div id="firstNameBox" style="background-color: var(--card-bg);" class="animated-box text-[13vw] sm:text-[11vw] md:text-[9.5vw] lg:text-[8.5rem] px-6 sm:px-10 pt-4 pb-8 sm:pt-6 sm:pb-12 border-4 sm:border-8 border-black transform -rotate-2 shadow-[12px_12px_0px_#000] z-10 mx-auto w-fit flex items-center justify-center leading-none condensed-text"></div>
            <div id="lastNameBox" style="background-color: var(--card-bg);" class="animated-box text-[12vw] sm:text-[10vw] md:text-[8.5vw] lg:text-[7.8rem] px-6 sm:px-10 py-3 sm:py-6 border-4 sm:border-8 border-black transform rotate-1 shadow-[12px_12px_0px_#000] -mt-2 sm:-mt-4 md:-mt-6 z-20 mx-auto w-fit flex items-center justify-center leading-none condensed-text"></div>
            <div id="saveessSubtitleBox" style="background-color: var(--card-bg);" class="animated-box text-[3.5vw] sm:text-[2.5vw] md:text-[1.8vw] lg:text-[1.5rem] px-5 py-2 border-4 border-black transform -rotate-1 shadow-[8px_8px_0px_#000] mt-3 z-30 mx-auto w-fit flex items-center justify-center leading-none condensed-text font-google-sans"></div>
          </div>
        `;
      } else if (page === 'projects') {
        return `
          <div style="background-color: var(--card-bg); color: var(--text-main);" class="pointer-events-auto border-4 sm:border-8 border-black shadow-[12px_12px_0px_#000] p-6 md:p-10 max-w-3xl w-full mx-4 max-h-[75vh] flex flex-col text-left transform -rotate-1 font-google-sans">
            <div class="border-b-4 border-black pb-4 mb-6 flex justify-between items-center">
              <div>
                <h1 class="text-2xl md:text-3xl font-black lowercase tracking-[-0.02em]">projects & works</h1>
                <p class="text-xs opacity-80 lowercase mt-1 font-medium font-google-sans">quantitative modeling & computational research</p>
              </div>
              <a href="https://github.com/saveesscore" target="_blank" style="background-color: var(--text-main); color: var(--bg-main);" class="text-xs font-black px-3 py-2 border-2 border-black shadow-[2px_2px_0px_#000] lowercase transition-transform hover:scale-105 font-google-sans">
                github.com/saveesscore &rarr;
              </a>
            </div>
            
            <div class="overflow-y-auto custom-scroll pr-2 space-y-5 text-sm md:text-base font-google-sans">
              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">private equity buyout models (buying vs. renting)</h2>
                <p class="opacity-90 lowercase font-medium mb-2 font-google-sans">transcanada financial modeling repository</p>
                <p class="opacity-80 text-xs md:text-sm lowercase leading-relaxed font-google-sans">
                  constructed comprehensive financial evaluation models comparing long-term capital allocation strategies, focusing on debt-to-equity leverage ratios, opportunity costs, and real estate acquisition metrics.
                </p>
              </div>

              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">mathematical medicine & pharmacometrics model</h2>
                <p class="opacity-90 lowercase font-medium mb-2 font-google-sans">quantitative pharmacology & drug concentration simulations</p>
                <p class="opacity-80 text-xs md:text-sm lowercase leading-relaxed font-google-sans">
                  engineered differential equation-based python models simulating drug concentration over time across diverse physiological pathways, benchmarking numerical integration frameworks.
                </p>
              </div>

              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">corporate pronatalism quantitative research paper</h2>
                <p class="opacity-90 lowercase font-medium mb-2 font-google-sans">microeconomic demographic modeling</p>
                <p class="opacity-80 text-xs md:text-sm lowercase leading-relaxed font-google-sans">
                  authored an extensive research paper evaluating corporate pronatalist policies through demographic geometric sequences and workforce productivity correlations.
                </p>
              </div>
            </div>
          </div>
        `;
      } else if (page === 'experience') {
        return `
          <div style="background-color: var(--card-bg); color: var(--text-main);" class="pointer-events-auto border-4 sm:border-8 border-black shadow-[12px_12px_0px_#000] p-6 md:p-10 max-w-3xl w-full mx-4 max-h-[75vh] flex flex-col text-left transform rotate-1 font-google-sans">
            <div class="border-b-4 border-black pb-4 mb-6 flex justify-between items-center">
              <h1 class="text-2xl md:text-3xl font-black lowercase tracking-[-0.02em] font-google-sans">experience & leadership</h1>
              <span style="background-color: var(--text-main); color: var(--bg-main);" class="text-xs font-bold px-3 py-1 rounded-sm font-google-sans">timeline</span>
            </div>

            <div class="overflow-y-auto custom-scroll pr-2 space-y-5 text-sm md:text-base font-google-sans">
              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">business administrative intern — skywise (airbus)</h2>
                <p class="opacity-90 lowercase font-medium mb-2 font-google-sans">jun 2026 – jul 2026 | waterloo, on</p>
                <ul class="list-disc list-inside opacity-80 space-y-1 lowercase text-xs md:text-sm font-google-sans">
                  <li>streamlined transition from NAVBLUE to Skywise with custom Confluence templates.</li>
                  <li>accelerated project workflows by one week across North American client accounts.</li>
                  <li>conducted cost-pattern analyses of airport data for actionable financial insights.</li>
                </ul>
              </div>

              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">director of marketing — young politicians of canada</h2>
                <p class="opacity-90 lowercase font-medium mb-2 font-google-sans">jun 2025 – dec 2025 | waterloo, on</p>
                <ul class="list-disc list-inside opacity-80 space-y-1 lowercase text-xs md:text-sm font-google-sans">
                  <li>established key partnerships with local civic leaders and student organization directors.</li>
                  <li>designed engagement strategies connecting youth with municipal governance.</li>
                </ul>
              </div>
            </div>
          </div>
        `;
      } else if (page === 'academics') {
        return `
          <div style="background-color: var(--card-bg); color: var(--text-main);" class="pointer-events-auto border-4 sm:border-8 border-black shadow-[12px_12px_0px_#000] p-6 md:p-10 max-w-3xl w-full mx-4 max-h-[75vh] flex flex-col text-left transform -rotate-1 font-google-sans">
            <div class="border-b-4 border-black pb-4 mb-6 flex justify-between items-center">
              <h1 class="text-2xl md:text-3xl font-black lowercase tracking-[-0.02em] font-google-sans">academics & certifications</h1>
              <span style="background-color: var(--text-main); color: var(--bg-main);" class="text-xs font-bold px-3 py-1 rounded-sm font-google-sans">96% avg</span>
            </div>

            <div class="overflow-y-auto custom-scroll pr-2 space-y-5 text-sm md:text-base font-google-sans">
              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">laurel heights secondary school</h2>
                <p class="opacity-90 lowercase font-medium mb-2 font-google-sans">business specialist high skills major (shsm) | 2024 – 2028</p>
                <ul class="list-disc list-inside opacity-80 space-y-1 lowercase text-xs md:text-sm font-google-sans">
                  <li>grade 11 student with consistent top-tier academic performance.</li>
                  <li>extracurriculars: 2x DECA Provincials, Ivey High School Case Competition, Canadian Economics Olympiad.</li>
                </ul>
              </div>

              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">licenses & certifications</h2>
                <ul class="list-disc list-inside opacity-80 space-y-1 lowercase text-xs md:text-sm mt-2 font-google-sans">
                  <li>ontario human rights 101 & accessibility code (ohrc)</li>
                  <li>worker health and safety awareness (whsa)</li>
                  <li>first degree black belt (kukkiwon, sep 2024)</li>

      } else if (page === 'who-i-am') {
        return `
          <div style="background-color: var(--card-bg); color: var(--text-main);" class="pointer-events-auto border-4 sm:border-8 border-black shadow-[12px_12px_0px_#000] p-6 md:p-10 max-w-3xl w-full mx-4 max-h-[75vh] flex flex-col text-left transform rotate-1 font-google-sans">
            <div class="border-b-4 border-black pb-4 mb-6 flex justify-between items-center">
              <h1 class="text-2xl md:text-3xl font-black lowercase tracking-[-0.02em] font-google-sans">who i am & skills</h1>

            <div class="overflow-y-auto custom-scroll pr-2 space-y-5 text-sm md:text-base font-google-sans">
              <div style="background-color: var(--bg-main);" class="project-card border-4 border-black p-4 shadow-[4px_4px_0px_#000]">
                <h2 class="text-lg md:text-xl font-bold lowercase mb-1 font-google-sans">about me</h2>

      }
      return '';
    }

    function renderMainContent() {
      const mainContainer = document.getElementById('mainContainer');
      const sunburstContainer = document.getElementById('homeSunburstContainer');
      if (!mainContainer) return;

      if (sunburstContainer) {
        if (currentPage === 'home') {
          sunburstContainer.classList.add('active');
        } else {
          sunburstContainer.classList.remove('active');
        }
      }

      mainContainer.innerHTML = renderMainContentHTML(currentPage);

      if (currentPage === 'home') {
        buildInteractiveText('firstNameBox', 'shaurya', 'letter-btn');
        buildInteractiveText('lastNameBox', 'visawadia.', 'letter-btn');
        buildInteractiveText('saveessSubtitleBox', 'saveess', 'letter-btn');
      }
    }

    function openPage(pageName) {
      if (isTransitioning || pageName === currentPage) return;
      isTransitioning = true;

      const mainContainer = document.getElementById('mainContainer');
      const sunburstContainer = document.getElementById('homeSunburstContainer');
      if (!mainContainer) {
        isTransitioning = false;
        return;
      }

      if (sunburstContainer) {
        sunburstContainer.classList.remove('active');
      }

      let slideX = 0;
      let slideY = 0;

      if (pageName === 'projects') slideX = '-105vw';
      else if (pageName === 'experience') slideX = '105vw';
      else if (pageName === 'academics') slideY = '-105vh';
      else if (pageName === 'who-i-am') slideY = '105vh';
      else if (pageName === 'home') {
        if (currentPage === 'projects') slideX = '105vw';
        else if (currentPage === 'experience') slideX = '-105vw';
        else if (currentPage === 'academics') slideY = '105vh';
        else if (currentPage === 'who-i-am') slideY = '-105vh';
      }

      // Slide-out current content with sweet-spot pacing
      mainContainer.style.transform = `translate(${slideX}, ${slideY})`;
      mainContainer.style.opacity = '0';

      setTimeout(() => {
        currentPage = pageName;
        renderHeaderBrand();

        mainContainer.style.transition = 'none';
        let enterX = '0px';
        let enterY = '0px';

        if (pageName === 'projects') enterX = '105vw';
        else if (pageName === 'experience') enterX = '-105vw';
        else if (pageName === 'academics') enterY = '105vh';
        else if (pageName === 'who-i-am') enterY = '-105vh';

        mainContainer.style.transform = `translate(${enterX}, ${enterY})`;
        mainContainer.innerHTML = renderMainContentHTML(currentPage);

        if (currentPage === 'home') {
          buildInteractiveText('firstNameBox', 'shaurya', 'letter-btn');
          buildInteractiveText('lastNameBox', 'visawadia.', 'letter-btn');
          buildInteractiveText('saveessSubtitleBox', 'saveess', 'letter-btn');
          setTimeout(() => {
            if (sunburstContainer) sunburstContainer.classList.add('active');
          }, 140);
        }

        void mainContainer.offsetWidth;

        // Slide-in new content with balanced sweet-spot speed
        setTimeout(() => {
          mainContainer.style.transition = 'transform 0.55s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.45s ease';
          mainContainer.style.transform = 'translate(0px, 0px)';
          mainContainer.style.opacity = '1';

          setTimeout(() => {
            isTransitioning = false;
          }, 560);
        }, 45);
      }, 420);
    }

    // Initial setup
    randomizeNebulaPositions();
    applyCurrentTheme();
    generateNightSkySpecks();
    renderHeaderBrand();
    renderMainContent();
    buildCustomText('navProjects', 'projects', 'nav-letter');
    buildCustomText('navExperience', 'experience', 'nav-letter');
    buildCustomText('footerAcademics', 'academics', 'footer-letter');
    buildCustomText('footerWhoIAM', 'who i am', 'footer-letter');
  </script>
